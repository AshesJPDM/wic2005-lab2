# topology.yaml — a small network described as data.
# build_topo.py reads this file and creates exactly this network in Mininet.
#
# Make it yours first (see "Your addresses" in the lab):
#   NNNN = the last 4 digits of your student ID, e.g. 4207
#   NN   = the last 2 digits, without a leading zero, e.g. 7
# Replace every NNNN and NN below. Don't put your full student ID here: this file
# goes in your repository, which may be public.

student_id_last4: "3161"

switches:
  - s1
  - s2
  - s3

hosts:
  - name: h1
    ip: 10.61.0.1/24
    ipv6: fd00:3161::1/64
  - name: h2
    ip: 10.61.0.2/24
    ipv6: fd00:3161::2/64
  - name: h3
    ip: 10.61.0.3/24
    ipv6: fd00:3161::3/64
  - name: h4
    ip: 10.61.0.4/24
    ipv6: fd00:3161::4/64
  - name: h5
    ip: 10.61.0.5/24
    ipv6: fd00:3161::5/64
  - name: h6
    ip: 10.61.0.6/24
    ipv6: fd00:3161::6/64

links:
  - [h1, s1]
  - [h2, s1]
  - [h3, s2]
  - [h4, s2]
  - [h5, s3]
  - [h6, s3]
  - [s1, s2]
  - [s2, s3]